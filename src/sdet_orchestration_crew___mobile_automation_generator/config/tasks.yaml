---
parse_test_cases_and_extract_screen_flow:
  description: >
    Read the provided test_cases.csv file for {feature_name} and parse
    the manual test cases. Extract the test case titles, detailed test steps, and
    expected results. Analyze the test steps to identify the logical mobile application
    screens involved in each test scenario. Group related test steps by the screens
    they interact with and create a logical flow mapping.
    FEATURE NAME: {feature_name}
    CSV CONTENT:
    {csv_content}
  expected_output: >
    'A structured JSON object containing: 1) Parsed test cases with
    titles, steps, and expected results, 2) Identified logical mobile screens for
    each test scenario, 3) Screen flow mapping showing the sequence of screens for
    each test case, 4) Atomic test actions grouped by screen. The JSON should be well-formatted
    and ready for the next agent to consume.'
  agent: product_owner_and_test_router
analyze_screenshots_and_generate_locators:
  description: >
    Your task is to extract all locators for all UI states using your custom tool.
    
    1. Execute the `LocatorExtractionTool`. It requires no arguments. It will automatically scan the 'assets/screens' folder, process the files in parallel, and return a master JSON dictionary.
    2. Review the returned master JSON dictionary.
    3. Ensure the extracted locators cover the required elements identified by the Product Owner in the previous step.
  expected_output: >
    'The master comprehensive JSON dictionary containing all cross-platform locators where keys are logical element
    names (e.g., ''login_button'', ''username_field'', ''submit_button'') and values
    are cross-platform locator dictionaries in the format: {''android'': {''by'':
    ''id'', ''value'': ''resource_id''}, ''ios'': {''by'': ''accessibility_id'', ''value'':
    ''accessibility_identifier''}}. Include fallback locators where primary ones might
    be unreliable.' Return ONLY valid JSON. Do not include markdown formatting blocks like ```json.
  agent: multimodal_vision_and_xml_analyzer
  context:
  - parse_test_cases_and_extract_screen_flow
generate_page_object_model_classes:
  description: >
    Using the cross-platform locator dictionary from the previous task
    and the existing framework context (base_page.py and utilities), write complete
    Python Page Object Model classes for {feature_name}. Ensure all classes inherit from
    the base page class, implement proper locator handling for cross-platform support,
    and include methods for all identified actions.

    You must create or update the Page Object Model (POM) for '{feature_name}'.
    The target file you are responsible for is: `src/pages/{module_name}_page.py`
    
    CRITICAL FRAMEWORK CONTEXT:
    Below is the source code of the existing framework base classes and utilities. 
    Study how `AndroidBasePage`, `IOSBasePage`, and `BasePage` are structured. 
    Study how methods like `click_element` or `wait_for_element` are called. 
    DO NOT invent new click/type and other methods; use the ones inherited from the base pages!
    
    --- START FRAMEWORK CONTEXT ---
    {framework_context_for_pom_generation}
    --- END FRAMEWORK CONTEXT ---

    Follow this STRICT autonomous workflow:
    1. CHECK EXISTING CODE: Use the `ReadFrameworkFileTool` on `src/pages/{module_name}_page.py`. 
       - If it exists, analyze the current code. You must UPDATE it by appending new locators and methods.
         Do not delete existing functionality!
       - If it does not exist, you will build it from scratch using the Reference POM as a style guide.
    2. CHECK UTILITIES: Use the `ListDirectoryTool` on `src/utils` to see if there are helper files related
       to the test logic (e.g., API calls, tokens). If you see a relevant utility, use `ReadFrameworkFileTool` to understand how to import and use it.
    3. SYNTHESIZE: Write the complete, final Python code for `src/pages/{module_name}_page.py`. 
       Ensure locators are dictionaries handling Android/iOS. Import the correct base pages. Define the 
       locators at the top of the class as dictionaries (e.g., `self.login_btn = {"android": (AppiumBy.ID, "..."), 
       "ios": (AppiumBy.ACCESSIBILITY_ID, "...")}`). Write action methods (e.g., `def click_login(self):`) 
       utilizing the framework's inherited methods.
    4. SAVE: Use the `FileWriterTool` to save the absolute final Python string to disk.
  expected_output: >
    A confirmation string detailing whether the file was newly created or successfully
    updated, and that the FileWriterTool executed successfully.
  agent: page_object_model_pom_crafter
  context:
  - analyze_screenshots_and_generate_locators
write_pytest_test_scripts:
  description: >
    You must create or update the Pytest script for the feature '{feature_name}'.
    The target file you are responsible for is: `tests/test_{module_name}.py`
    
    You have the original test logic parsed by the Product Owner:
    {csv_content}
    
    CRITICAL FRAMEWORK CONTEXT (Fixtures & Reference Test):
    {framework_context_for_test_generation}
    
    Follow this STRICT autonomous workflow:
    1. READ THE POM: Use `ReadFrameworkFileTool` to read the Page Object just created/updated by the POM crafter at `src/pages/{module_name}.py`. You MUST know the exact method names to call in your test.
    2. CHECK EXISTING TEST FILE: Use `ReadFrameworkFileTool` on `tests/test_{module_name}.py`. 
       - If it exists, analyze the current code. You must append the new test functions to the existing class/module. DO NOT delete existing tests!
       - If it does not exist, build it from scratch using the Reference Test as a style guide.
    3. SYNTHESIZE: Write the complete, executable test_{module_name}.py Pytest script containing:
       1) Proper imports and fixtures, 2) Test functions for each test case scenario,
       3) Page object instantiation and method calls, 4) Assertions validating expected
       outcomes, 5) Proper test setup and teardown, 6) Clear, descriptive test function
       names and docstrings. The script should be immediately runnable with pytest command.
    4. SAVE: Use `FileWriterTool` to save the final code to `tests/test_{module_name}.py`.
  expected_output: >
    A confirmation string detailing whether the test file was newly created or updated, and that the 
    FileWriterTool executed successfully.
  agent: pytest_automation_synthesizer
  context:
  - generate_page_object_model_classes
